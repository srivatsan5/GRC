.ch{font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:20px;font-feature-settings:"cv11";-webkit-font-smoothing:antialiased}
.ch a{color:var(--acc-ink);text-decoration:none;font-weight:500}.ch a:hover{text-decoration:underline;text-underline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:Newsreader,Georgia,serif;font-optical-sizing:auto;font-variant-numeric:lining-nums tabular-nums}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.sc{font-size:12px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.cap{font-size:12px;line-height:18px;color:var(--ink-3)}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.pnl{background:var(--panel);border-radius:12px;box-shadow:var(--sh);min-width:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:20px 24px 0}
.ph h2{margin:0;font-family:Newsreader,Georgia,serif;font-size:21px;line-height:26px;font-weight:500;letter-spacing:-.01em}
.nav{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:7px;color:var(--ink-2);font-size:13px}
.ch .nav{text-decoration:none;font-weight:400}
.ch .nav:hover{background:var(--hover);color:var(--ink);text-decoration:none}
.nav.on{background:var(--panel);color:var(--ink);font-weight:500;box-shadow:var(--sh)}
.ch .nav.on{font-weight:500}
.nav.on .ico{color:var(--acc)}
.step{width:18px;height:18px;flex:none;border-radius:9px;font:500 11px/18px Newsreader,serif;text-align:center;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--rule-2)}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 15px;border:0;border-radius:8px;font:500 13px Inter,sans-serif;cursor:pointer;transition:background-color 180ms cubic-bezier(.2,0,0,1),box-shadow 180ms cubic-bezier(.2,0,0,1)}
.btn-1{background:var(--acc);color:var(--on-acc);box-shadow:inset 0 1px 0 oklch(1 0 0 / 0.16),inset 0 -1px 0 oklch(0 0 0 / 0.12),0 1px 2px oklch(0.22 0.015 60 / 0.2)}
.btn-2{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--rule-2),0 1px 1px oklch(0.22 0.015 60 / 0.04)}
.btn-2:hover{background:var(--sunken)}
.btn-g{background:transparent;color:var(--ink-2);box-shadow:none}
.btn-sm{height:32px;padding:0 12px}
.btn:focus-visible,.cell:focus-visible,.seg button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:9px;background:var(--sunken);box-shadow:inset 0 0 0 1px var(--rule)}
.seg button{height:28px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);font:500 12px Inter,sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--sh)}
.pips{display:inline-flex;align-items:flex-end;gap:2px;height:10px}
.pips i{display:block;width:3px;background:currentColor;opacity:.28;border-radius:1px}
.pips i:nth-child(1){height:4px}.pips i:nth-child(2){height:6px}.pips i:nth-child(3){height:8px}.pips i:nth-child(4){height:10px}
.p1 i:nth-child(-n+1),.p2 i:nth-child(-n+2),.p3 i:nth-child(-n+3),.p4 i:nth-child(-n+4){opacity:1}
.hatch{background-image:repeating-linear-gradient(135deg,transparent 0 4px,var(--hatch) 4px 5px)}
.cell{position:relative;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;margin:0;border:0;border-radius:6px;padding:8px 10px;font:inherit;text-align:left;cursor:pointer;transition:box-shadow 180ms cubic-bezier(.2,0,0,1)}

.b-high{background:var(--r-high-wash);color:var(--r-high-tx)}.b-high.has{background:var(--r-high);color:var(--r-high-fg)}
.b-crit{background:var(--r-crit-wash);color:var(--r-crit-tx)}.b-crit.has{background:var(--r-crit);color:var(--r-crit-fg)}
.cell.has{box-shadow:inset 0 1px 0 oklch(1 0 0 / 0.18),inset 0 -1px 0 oklch(0 0 0 / 0.06)}
.cell:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.cell.sel{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink);z-index:2}
.tip{position:absolute;right:calc(100% + 12px);top:-8px;width:244px;display:block;padding:14px 16px;border-radius:10px;background:var(--raised);color:var(--ink);box-shadow:var(--pop);font-size:12px;line-height:18px;z-index:3;cursor:default}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:5px;font-size:12px;font-weight:500;white-space:nowrap}
.kpi{display:flex;flex-direction:column;gap:8px;padding:22px 28px 24px;border-left:1px solid var(--rule);min-width:0}
.kpi:first-child{border-left:0}
.fig{font-family:Newsreader,Georgia,serif;font-size:64px;line-height:60px;font-weight:400;letter-spacing:-.025em;font-variant-numeric:lining-nums tabular-nums}
.att{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:12px 0;border-top:1px solid var(--rule)}
.grp{display:flex;align-items:center;gap:8px;padding:16px 0 4px}
.trow{display:grid;grid-template-columns:128px minmax(0,1fr) 124px 52px;gap:16px;align-items:center;padding:9px 0;border-top:1px solid var(--rule)}
.trow .tag{justify-self:start}
@media (prefers-reduced-motion: reduce){.ch *{transition:none !important}}
</style>
