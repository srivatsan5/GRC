name: CI
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (typecheck, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: OpenAPI spec is up to date
        run: npm run openapi && git diff --exit-code openapi.json
      - name: No high or critical vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

  web:
    name: Web app (lint, typecheck, unit tests, build, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Generated API types are up to date
        run: npm run api:types && git diff --exit-code lib/api-types.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
      - name: No high or critical vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (core flow, real data, security)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: api
      - run: npm run build
        working-directory: api
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
      - name: Install Playwright and Chromium
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Run the suites (each against a fresh local stack)
        run: npm run e2e
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pericope-api:ci ./api
      - run: docker build -t pericope-web:ci .
