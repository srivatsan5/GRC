.rr.compact{--row-height:32px;--badge-height:20px;--cell-padding-x:10px}

.rr{font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:20px;font-feature-settings:"cv11";-webkit-font-smoothing:antialiased;color:var(--foreground)}
.rr a{color:var(--primary);text-decoration:none;font-weight:500}.rr a:hover{text-decoration:underline;text-underline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:Newsreader,Georgia,serif;font-optical-sizing:auto;font-variant-numeric:lining-nums tabular-nums}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.caps{font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-foreground)}
.cap{font-size:12px;line-height:18px;color:var(--muted-foreground)}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border:0;border-radius:8px;font:500 13px Inter,sans-serif;cursor:pointer;white-space:nowrap;transition:background-color 150ms cubic-bezier(.2,0,0,1)}
.btn-1{background:var(--primary);color:var(--primary-foreground);box-shadow:var(--elevation-button)}
.btn-2{background:var(--card);color:var(--foreground);box-shadow:0 0 0 1px var(--border-strong)}
.btn-2:hover{background:var(--muted)}
.btn-g{background:transparent;color:var(--foreground-secondary)}
.btn-g:hover{background:var(--hover)}
.btn-sm{height:32px;padding:0 11px;font-size:12.5px}
.btn-i{width:32px;padding:0}
.btn:focus-visible,.chip:focus-visible,.seg button:focus-visible,.rr a:focus-visible,.rr input:focus-visible,.rail a:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:9px;background:var(--muted);box-shadow:inset 0 0 0 1px var(--border)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:0;border-radius:6px;background:transparent;color:var(--foreground-secondary);font:500 12px Inter,sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--foreground);box-shadow:var(--elevation-panel)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 12px;border:0;border-radius:16px;background:var(--card);color:var(--foreground-secondary);font:400 12.5px Inter,sans-serif;box-shadow:0 0 0 1px var(--border-strong);cursor:pointer;white-space:nowrap}
.chip b{font-weight:500;color:var(--foreground)}
.chip.on{background:var(--accent);box-shadow:0 0 0 1px var(--primary)}
.chip.add{border-radius:16px;box-shadow:0 0 0 1px var(--border-strong);border:0;background:transparent;color:var(--primary);font-weight:500}
.pips{display:inline-flex;align-items:flex-end;gap:2px;height:10px}
.pips i{display:block;width:3px;background:currentColor;opacity:.3;border-radius:1px}
.pips i:nth-child(1){height:4px}.pips i:nth-child(2){height:6px}.pips i:nth-child(3){height:8px}.pips i:nth-child(4){height:10px}
.p1 i:nth-child(-n+1),.p2 i:nth-child(-n+2),.p3 i:nth-child(-n+3),.p4 i:nth-child(-n+4){opacity:1}
.hatch{background-image:repeating-linear-gradient(135deg,transparent 0 4px,var(--risk-hatch) 4px 5px)}
.bdg{display:inline-flex;align-items:center;gap:6px;height:var(--badge-height);padding:0 8px;border-radius:5px;font-size:12px;font-weight:500;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums;box-sizing:border-box}
.b-low{background:var(--risk-low);color:var(--risk-low-fg)}
.b-moderate{background:var(--risk-moderate);color:var(--risk-moderate-fg)}
.b-high{background:var(--risk-high);color:var(--risk-high-fg)}
.b-critical{background:var(--risk-critical);color:var(--risk-critical-fg)}
.b-nr{background-color:var(--risk-unrated-bg);color:var(--risk-unrated-text);box-shadow:inset 0 0 0 1px var(--risk-unrated-border);font-weight:400}
.compact .pips{display:none}
.compact .bdg{padding:0 7px}
.st{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:5px;font-size:12px;font-weight:500;white-space:nowrap}
.st-Draft{background:var(--secondary);color:var(--foreground-secondary);box-shadow:inset 0 0 0 1px var(--border-strong)}
.st-Submitted{background:var(--status-info-bg);color:var(--status-info-fg)}
.st-Approved{background:var(--status-success-bg);color:var(--status-success-fg)}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.tbl th{position:sticky;top:0;z-index:2;height:40px;padding:0 var(--cell-padding-x);background:var(--card);text-align:left;font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-foreground);box-shadow:inset 0 -1px 0 var(--border-strong);white-space:nowrap}
.tbl td{height:var(--row-height);padding:0 var(--cell-padding-x);border-bottom:1px solid var(--border);white-space:nowrap;box-sizing:border-box}
.tbl tbody tr:hover td{background:var(--hover)}
.tbl tr.sel td{background:var(--accent)}
.tbl tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--primary)}
.tbl .r{text-align:right}
.rline{display:block;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:18px}
.compact .rline{max-width:280px}
.stmt{font-weight:500}
.stmt.none{font-weight:400;font-style:italic;color:var(--muted-foreground)}
.meta{display:block;max-width:240px;overflow:hidden;text-overflow:ellipsis;font-size:12px;line-height:16px;color:var(--muted-foreground)}
.refi{display:none}
.compact .meta{display:none}
.compact .refi{display:inline;margin-left:8px;font-size:11.5px;color:var(--muted-foreground)}
.av{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:12px;background:var(--secondary);color:var(--foreground-secondary);font-size:10px;font-weight:600;letter-spacing:.02em;flex:none;box-shadow:inset 0 0 0 1px var(--border)}
.compact .av{width:20px;height:20px;border-radius:10px;font-size:9px}
.cb{width:16px;height:16px;margin:0;accent-color:var(--primary)}
.rail a{position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;color:var(--sidebar-foreground)}
.rail a:hover{background:var(--hover);color:var(--foreground);text-decoration:none}
.rail a.on{background:var(--sidebar-accent);color:var(--primary);box-shadow:var(--elevation-panel)}
.rail .tt{position:absolute;left:48px;top:50%;transform:translateY(-50%);padding:4px 8px;border-radius:6px;background:var(--foreground);color:var(--background);font-size:12px;font-weight:500;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 150ms}
.rail a:hover .tt,.rail a:focus-visible .tt{opacity:1}
.step{flex:1;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;min-width:0}
.step .n{width:24px;height:24px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font:500 13px Newsreader,serif;box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--foreground-secondary)}
.step.cur{background:var(--card);box-shadow:var(--elevation-panel)}
.step.cur .n{background:var(--primary);color:var(--primary-foreground);box-shadow:none}
.bar{position:relative;height:3px;border-radius:2px;background:var(--border);overflow:hidden;margin-top:5px}
.bar span{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--primary)}
.sec{display:flex;flex-direction:column;gap:12px;padding:20px 24px;border-top:1px solid var(--border)}
.sec h3{margin:0;font:500 17px/22px Newsreader,Georgia,serif;display:flex;align-items:baseline;gap:8px}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted-foreground)}.kv dd{margin:0}
.mm{display:grid;grid-template-columns:repeat(5,28px);grid-auto-rows:28px;gap:3px;position:relative}
.mm span{border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.w-low{background:var(--risk-low-bg)}.w-moderate{background:var(--risk-moderate-bg)}.w-high{background:var(--risk-high-bg)}.w-critical{background:var(--risk-critical-bg)}
@media (prefers-reduced-motion: reduce){.rr *{transition:none !important}}
</style>
