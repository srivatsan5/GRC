:12px\">16\u201325 \u00b7 L 0.44<\/span><\/span><\/div>\n      <div class=\"rb hatch\" style=\"height:92px;background-color:oklch(0.945 0.010 78);color:oklch(0.41 0.015 60);box-shadow:inset 0 0 0 1px oklch(0.22 0.015 60 / 0.14)\"><span class=\"pips\"><i><\/i><i><\/i><i><\/i><i><\/i><\/span><span><span class=\"serif\" style=\"font-size:22px\">Not rated<\/span> <span style=\"font-size:12px\">\u2014<\/span><\/span><\/div>\n    <\/div>\n    <div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding:4px;border-radius:12px;background:oklch(0.185 0.010 60)\">\n      <div style=\"height:52px;border-radius:7px;background:oklch(0.40 0.05 155);color:oklch(0.95 0.02 150);padding:0 12px;display:flex;align-items:center;justify-content:space-between\"><span class=\"serif\" style=\"font-size:17px\">Low<\/span><span class=\"num\" style=\"font-size:11px\">L 0.40<\/span><\/div>\n      <div style=\"height:52px;border-radius:7px;background:oklch(0.58 0.12 75);color:oklch(0.15 0.03 70);padding:0 12px;display:flex;align-items:center;justify-content:space-between\"><span class=\"serif\" style=\"font-size:17px\">Moderate<\/span><span class=\"num\" style=\"font-size:11px\">L 0.58<\/span><\/div>\n      <div style=\"height:52px;border-radius:7px;background:oklch(0.67 0.16 50);color:oklch(0.15 0.035 45);padding:0 12px;display:flex;align-items:center;justify-content:space-between\"><span class=\"serif\" style=\"font-size:17px\">High<\/span><span class=\"num\" style=\"font-size:11px\">L 0.67<\/span><\/div>\n      <div style=\"height:52px;border-radius:7px;background:oklch(0.76 0.14 25);color:oklch(0.17 0.035 25);padding:0 12px;display:flex;align-items:center;justify-content:space-between\"><span class=\"serif\" style=\"font-size:17px\">Critical<\/span><span class=\"num\" style=\"font-size:11px\">L 0.76<\/span><\/div>\n      <div style=\"height:52px;border-radius:7px;background-color:oklch(0.215 0.011 60);background-image:repeating-linear-gradient(135deg,transparent 0
