# Local/production stack for the Pericope API.
#   cp api/.env.example api/.env   (fill it in)
#   docker compose up -d --build
# The Next.js app is deployed separately (see FRONTEND_README.md); point
# NEXT_PUBLIC_API_URL at this API and add the app's URL to CORS_ORIGINS.
services:
  api:
    build: ./api
    image: pericope-api:latest
    env_file: ./api/.env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
    ports:
      - "5000:5000"
    volumes:
      - pericope-data:/data
    restart: unless-stopped

volumes:
  pericope-data:
